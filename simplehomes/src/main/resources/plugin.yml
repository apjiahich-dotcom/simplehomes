name: Simplehomes
version: 1.0
author: apjiah
main: com.apjiah.simplehomes.Simplehomes
api-version: 1.20

commands:
  sethome:
    description: Сохранить дом
    usage: /sethome
  home:
    description: Телепортироваться домой
    usage: /home
  delhome:
    description: Удалить дом
    usage: /delhome

permissions:
  simplehomes.use:
    description: Разрешает использовать команды Simplehomes
    default: true